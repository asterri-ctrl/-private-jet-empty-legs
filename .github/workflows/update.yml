name: Refresh empty-leg calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "generate.py"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/update.yml"

concurrency:
  group: repo-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync latest main
        run: git pull --ff-only origin main
      - run: python generate.py
      - name: Commit feed if changed
        run: |
          git config user.name "empty-leg-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Refresh empty-leg calendar"

          if git push; then
            exit 0
          fi

          echo "Branch moved during refresh; rebuilding once from latest main."
          git fetch origin main
          git reset --hard origin/main
          python generate.py
          git add docs/*.ics

          if git diff --cached --quiet; then
            echo "Latest main already contains equivalent output."
            exit 0
          fi

          git commit -m "Refresh empty-leg calendar"
          git push
