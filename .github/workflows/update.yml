name: Refresh empty-leg calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "generate.py"
      - "config.yaml"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate.py
      - name: Commit feed if changed
        run: |
          git config user.name "empty-leg-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/empty-legs.ics
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh empty-leg calendar"
            git push
          fi
