name: Refresh Nordic infrastructure radar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "requirements.txt"
      - ".github/workflows/radar.yml"

concurrency:
  group: repo-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python radar/update_radar.py
      - name: Commit radar if changed
        run: |
          git config user.name "nordic-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/radar/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh Nordic infrastructure radar"
            git pull --rebase origin main
            git push
          fi
