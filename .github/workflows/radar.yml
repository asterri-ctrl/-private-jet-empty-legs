name: Refresh Nordic infrastructure radar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */4 * * *"
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "requirements.txt"
      - ".github/workflows/radar.yml"

concurrency:
  group: repo-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync latest main
        run: git pull --ff-only origin main
      - run: python radar/update_radar.py
      - name: Commit radar if changed
        run: |
          git config user.name "nordic-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/radar/ docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Refresh Nordic infrastructure radar"

          if git push; then
            exit 0
          fi

          echo "Branch moved during refresh; rebuilding once from latest main."
          git fetch origin main
          git reset --hard origin/main
          python radar/update_radar.py
          git add docs/radar/

          if git diff --cached --quiet; then
            echo "Latest main already contains equivalent output."
            exit 0
          fi

          git commit -m "Refresh Nordic infrastructure radar"
          git push
